name: ObRail Europe - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Tests unitaires pytest ─────────────────────────
  tests:
    name: Tests automatises (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov httpx
      - run: pytest tests/ -v --tb=short --cov=api --cov-report=term-missing
      - run: pytest tests/ --cov=api --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 2 : Build images Docker ────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile.api -t obrail-api:latest .
      - run: docker build -f Dockerfile.frontend -t obrail-frontend:latest .
      - run: docker build -f Dockerfile.etl -t obrail-etl:latest .

  # ── Job 3 : Integration Docker Compose ─────────────────────
  integration:
    name: Test integration Docker Compose
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Demarrage DB et API
        run: docker compose up -d db api

      - name: Attente API disponible (retry 30x5s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API prete apres $((i*5))s"
              exit 0
            fi
            echo "Tentative $i/30..."
            sleep 5
          done
          docker compose logs api
          docker compose logs db
          exit 1

      - name: Verification /health
        run: curl -f http://localhost:8000/health

      - name: Verification /stats
        run: curl -f http://localhost:8000/stats

      - name: Verification /operateurs
        run: curl -f http://localhost:8000/operateurs

      - name: Arret services
        if: always()
        run: docker compose down

  # ── Job 4 : Tests E2E Playwright ───────────────────────────
  e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation dependances E2E
        working-directory: E2E
        run: npm ci

      - name: Installation Playwright chromium
        working-directory: E2E
        run: npx playwright install --with-deps chromium

      - name: Installation dependances frontend
        working-directory: frontend
        run: npm ci

      - name: Demarrage DB et API
        run: docker compose up -d db api

      - name: Attente API disponible
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API prete"
              break
            fi
            sleep 5
          done

      - name: Demarrage frontend Next.js sur port 3002
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run dev -- -p 3002 &

      - name: Attente frontend port 3002
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:3002; then
              echo "Frontend pret"
              break
            fi
            echo "Attente frontend $i/24..."
            sleep 5
          done

      - name: Execution tests E2E
        working-directory: E2E
        env:
          CI: true
        run: npx playwright test --reporter=html

      - name: Upload rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: E2E/playwright-report/
          retention-days: 7

      - name: Upload screenshots echecs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: E2E/test-results/

      - name: Arret services
        if: always()
        run: docker compose down