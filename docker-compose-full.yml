
# Ports :
#   5432 - PostgreSQL ObRail
#   8000 - API FastAPI
#   8501 - Dashboard Streamlit
#   3002 - Frontend React/Next.js
#   8080 - Airflow UI
#   9090 - Prometheus
#   3001 - Grafana

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    DB_HOST: db
    DB_PORT: 5432
    DB_NAME: obrail_db
    DB_USER: postgres
    DB_PASSWORD: postgres
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/obrail/src
    - ./data:/opt/airflow/obrail/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow_db:
      condition: service_healthy

services:

  # ── Base de données PostgreSQL 16 ──────────────────────
  db:
    image: postgres:16-alpine
    container_name: obrail_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: obrail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obrail_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API FastAPI — 13 endpoints + 2 modèles ML ──────────
  # Enjeu 1 : CO2 (Random Forest R²=0,86)
  # Enjeu 2 : Sous-desserte (Logistic Regression AUC=0,74)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: obrail_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: obrail_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      # Monte les modèles ML depuis la machine hôte
      # pour permettre le remplacement sans rebuild
      - ./notebooks/outputs_models:/app/notebooks/outputs_models:ro
      - ./notebooks/ml_splits:/app/notebooks/ml_splits:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Frontend React/Next.js 16 ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: obrail_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3000"

  # ── Dashboard Streamlit ────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: obrail_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: obrail_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"

  # ── ETL Pipeline (exécution manuelle ou via Airflow) ───
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: obrail_etl
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: obrail_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks

  # ── Airflow DB ─────────────────────────────────────────
  airflow_db:
    image: postgres:16-alpine
    container_name: obrail_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Init ───────────────────────────────────────
  airflow_init:
    <<: *airflow-common
    container_name: obrail_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install psycopg2-binary pandas sqlalchemy python-dotenv requests &&
        airflow db migrate &&
        airflow users create \
          --username admin --password admin \
          --firstname ObRail --lastname Admin \
          --role Admin --email admin@obrail.eu
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────
  airflow_webserver:
    <<: *airflow-common
    container_name: obrail_airflow_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ──────────────────────────────────
  airflow_scheduler:
    <<: *airflow-common
    container_name: obrail_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: obrail_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: obrail_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # SMTP désactivé en production — utiliser webhook Grafana pour les alertes
      # GF_SMTP_ENABLED: "true"
      # GF_SMTP_HOST: "smtp.gmail.com:587"
      # GF_SMTP_USER: "${GRAFANA_SMTP_USER}"
      # GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/obrail.json:ro
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
  prometheus_data:
  grafana_data: